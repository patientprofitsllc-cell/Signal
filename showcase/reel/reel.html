<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Patient Creations Reel</title>
<!--
  9:16 promo reel: a 3D desk scene (reel/room.js) filmed by a hand-held "phone", with the live site on the monitor,
  a caption, and an outro. Frames are driven by window.renderFrame(t, screenImage, scroll) so render.cjs can
  capture them deterministically; render.cjs supplies each screen image from the real site.
  Optional query params: ?handle=@yourhandle&caption=Websites%20in%202026
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 720px; height: 1280px; overflow: hidden; background: #1b1a17; }
  body { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
  #room { position: absolute; inset: 0; width: 720px; height: 1280px; display: block; }
  /* Caption (stays put while the "phone" moves) */
  .caption {
    position: absolute; left: 90px; top: 266px; height: 74px; display: flex; align-items: center;
    padding: 0 20px; border-radius: 12px; background: #000; color: #fff;
    font-weight: 800; font-size: 47px; letter-spacing: -0.5px; white-space: nowrap;
  }
  .caption .emoji { font-family: "Noto Color Emoji", "Apple Color Emoji", sans-serif; font-weight: 400; margin-left: 12px; }
  .ig-small { position: absolute; left: 634px; top: 284px; width: 40px; height: 40px; }
  .handle-small {
    position: absolute; right: 48px; top: 346px; color: #fff; font-weight: 800; font-size: 13px; letter-spacing: 0.2px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  .outro { position: absolute; left: 0; right: 0; top: 560px; display: grid; justify-items: center; gap: 22px; opacity: 0; }
  .outro svg { width: 104px; height: 104px; }
  .outro span { color: #fff; font-weight: 800; font-size: 19px; letter-spacing: 0.2px; }
</style>
</head>
<body>
<canvas id="room"></canvas>
<div class="caption" id="caption"><span id="caption-text">Websites in 2026</span><span class="emoji">😮‍💨</span>:</div>
<svg class="ig-small" id="ig-small" viewBox="0 0 48 48" aria-hidden="true"></svg>
<div class="handle-small" id="handle-small"></div>
<div class="outro" id="outro">
  <svg id="ig-big" viewBox="0 0 48 48" aria-hidden="true"></svg>
  <span id="handle-big"></span>
</div>

<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
<script type="module">
  import { createRoom } from './room.js';

  const q = new URLSearchParams(location.search);
  const HANDLE = (q.get('handle') || 'patientcreations.com').toUpperCase();
  if (q.get('caption')) document.getElementById('caption-text').textContent = q.get('caption');
  document.getElementById('handle-small').textContent = HANDLE;
  document.getElementById('handle-big').textContent = HANDLE;

  const igSvg = (id) => `
    <defs><linearGradient id="${id}" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#feda75"/><stop offset="0.3" stop-color="#fa7e1e"/>
      <stop offset="0.55" stop-color="#d62976"/><stop offset="0.8" stop-color="#962fbf"/><stop offset="1" stop-color="#4f5bd5"/>
    </linearGradient></defs>
    <rect x="5" y="5" width="38" height="38" rx="11" fill="none" stroke-width="4"/>
    <circle cx="24" cy="24" r="8.5" fill="none" stroke-width="4"/>
    <circle cx="34.5" cy="13.5" r="2.6" stroke="none"/>`;
  const igS = document.getElementById('ig-small'), igB = document.getElementById('ig-big');
  igS.innerHTML = igSvg('gs'); igB.innerHTML = igSvg('gb');
  function paintIg(svg, gradient, gid, hue) {
    const c = gradient ? `url(#${gid})` : '#fff';
    svg.querySelectorAll('rect,circle').forEach((n, i) => { if (i < 2) n.setAttribute('stroke', c); else n.setAttribute('fill', c); });
    // Spin the gradient direction instead of shifting hues, so the colours stay on-brand for Instagram
    const lg = svg.querySelector('linearGradient'), a = (hue || 0) * Math.PI / 180;
    lg.setAttribute('x1', (0.5 - Math.cos(a) * 0.5).toFixed(3)); lg.setAttribute('y1', (0.5 + Math.sin(a) * 0.5).toFixed(3));
    lg.setAttribute('x2', (0.5 + Math.cos(a) * 0.5).toFixed(3)); lg.setAttribute('y2', (0.5 - Math.sin(a) * 0.5).toFixed(3));
  }
  const outro = document.getElementById('outro');
  const caption = document.getElementById('caption');
  const handleSmall = document.getElementById('handle-small');
  const clamp = (v) => Math.min(1, Math.max(0, v));
  const ease = (t) => t * t * (3 - 2 * t);

  const room = createRoom(document.getElementById('room'));

  // Timeline (seconds), matched to the original reel:
  //   0.0 – 8.0  the site scrolls through its six 3D scenes
  //   8.0 – 8.6  it lands on the welcome section
  //   8.7 – end  dimmed outro with the animated Instagram mark
  window.REEL = {
    duration: 12.2, fps: 30,
    scrollAt(t, M) {
      if (t < 8.0) return M.top + (t / 8.0) * M.span;
      return M.top + M.span + ease(clamp((t - 8.0) / 0.6)) * (M.welcome - M.top - M.span);
    },
  };

  // t: seconds. screen: data URL of the site frame for this instant. scroll: page scroll position in px.
  window.renderFrame = async (t, screen, scroll = 0) => {
    if (screen) {
      const img = new Image(); img.src = screen; await img.decode();
      room.setScreen(img);
    }
    const d = ease(clamp((t - 8.7) / 0.35));
    room.render(t, { scroll: scroll / 1000, dim: 0.62 * d });
    paintIg(igS, Math.floor(t * 2.2) % 3 === 1, 'gs', 45);
    caption.style.opacity = (1 - 0.7 * d).toFixed(3);
    igS.style.opacity = handleSmall.style.opacity = (1 - d).toFixed(3);
    outro.style.opacity = d.toFixed(3);
    outro.style.transform = `scale(${(0.92 + 0.08 * d).toFixed(3)})`;
    const late = t > 10.6;
    paintIg(igB, !late || Math.floor(t * 3) % 4 === 0, 'gb', 45 + (t - 8.7) * 120);
  };
  await window.renderFrame(0);
  window.reelReady = true;
</script>
